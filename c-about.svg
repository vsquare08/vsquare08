<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="About me: I build AI for learning and now for healthcare and the brain." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c24"/><stop offset="1" stop-color="#17144a"/></linearGradient><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ce1e6"/><stop offset="0.5" stop-color="#ffb703"/><stop offset="1" stop-color="#ff5c7a"/></linearGradient></defs><rect x="1" y="1" width="898" height="328" rx="16" fill="url(#bg)" stroke="#2a2f63" stroke-width="2"/><text x="36" y="53" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">I like building things that make learning feel like a conversation instead of a chore.</text><text x="36" y="81" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">My first big project was a chatbot that listens to a lecture, summarizes it, and then</text><text x="36" y="109" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">quizzes you on it. It never gets tired of repeating a topic.</text><text x="36" y="151" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Now I&#x27;m taking the same idea into healthcare, with a focus on the brain. I&#x27;m</text><text x="36" y="179" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">interested in models that can help with early detection, support a diagnosis, or</text><text x="36" y="207" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">personalize neuro-rehabilitation. In healthcare a wrong output is a risk, not just a</text><text x="36" y="235" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">bug, so I care a lot about making models explainable and reliable.</text><text x="36" y="277" font-size="17" fill="#ffb703" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">I read neuro papers at night and regret it in the morning.</text></svg>