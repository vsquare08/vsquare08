name: GitHub Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: plattner/buildgithubcontributionssnake@v3
        with:
          github_user: ${{ github.repository_owner }}
          svg_filename: snake.svg
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
