<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17141b">
<title>Neuron Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17141b;
    --ink-2: #2a2330;
    --cyan: #ff7b93;
    --amber: #ff7b93;
    --coral: #ff4d6d;
    --text: #eae4ee;
    --muted: #9a90a6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(14px + env(safe-area-inset-top)) 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }
  .hud .score { font-size: clamp(34px, 7vw, 56px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .hud .meta { margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .hud .right { text-align: right; }
  .lives { display: flex; gap: 8px; justify-content: flex-end; }
  .life {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    transition: background .25s, box-shadow .25s, transform .25s;
  }
  .life.gone { background: #2e2835; box-shadow: none; transform: scale(.7); }
  .combo { margin-top: 10px; font-size: 18px; font-weight: 700; color: var(--amber); min-height: 24px; }

  .mute {
    position: fixed;
    right: 20px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    background: transparent;
    border: 1px solid #2e2835;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .mute:hover { color: var(--text); border-color: var(--cyan); }

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at center, rgba(23,20,27,.55), rgba(23,20,27,.9));
  }
  .overlay[hidden] { display: none; }
  .panel { max-width: 460px; text-align: left; }
  .panel h1 { margin: 0 0 14px; font-size: clamp(44px, 10vw, 76px); font-weight: 800; line-height: .95; letter-spacing: -0.04em; }
  .panel h1 span { color: var(--cyan); }
  .panel p { margin: 0 0 22px; font-size: 16px; line-height: 1.55; color: var(--muted); max-width: 40ch; }
  .stats { display: flex; gap: 28px; margin: 0 0 24px; }
  .stats div { font-size: 13px; color: var(--muted); }
  .stats b { display: block; font-size: 30px; color: var(--text); font-weight: 800; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    padding: 14px 30px;
    border: 0;
    border-radius: 999px;
    background: var(--amber);
    color: #17141b;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 8px 28px rgba(255,123,147,.28);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(255,123,147,.4); }
  .btn:active { transform: translateY(0) scale(.98); }
  .link { color: var(--muted); font-size: 14px; text-decoration: none; border-bottom: 1px solid #2e2835; }
  .link:hover { color: var(--text); border-color: var(--cyan); }
  .btn:focus-visible, .link:focus-visible, .mute:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
  .newbest { color: var(--amber); font-weight: 700; font-size: 15px; margin: -10px 0 22px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Neuron Dash game board"></canvas>

<div class="hud" aria-live="off">
  <div>
    <div class="score" id="score">0</div>
    <div class="meta">Best <span id="best">0</span></div>
  </div>
  <div class="right">
    <div class="lives" id="lives" aria-label="Signals left">
      <div class="life"></div><div class="life"></div><div class="life"></div>
    </div>
    <div class="combo" id="combo"></div>
  </div>
</div>

<button class="mute" id="mute" type="button">Sound on</button>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>Neuron<br><span>Dash</span></h1>
    <p>Neurons light up across the screen. Tap each one as its ring closes in. Tapping later scores more. Miss three and the network goes quiet.</p>
    <div class="row">
      <button class="btn" id="start" type="button">Start</button>
      <a class="link" href="../" target="_top">Back to site</a>
    </div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1>Network<br><span>quiet</span></h1>
    <div class="stats">
      <div><b id="fScore">0</b>Score</div>
      <div><b id="fCombo">0</b>Best combo</div>
      <div><b id="fBest">0</b>High score</div>
    </div>
    <div class="newbest" id="newBest" hidden>New high score.</div>
    <div class="row">
      <button class="btn" id="again" type="button">Play again</button>
      <a class="link" href="../" target="_top">Back to site</a>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = (id) => document.getElementById(id);
  const el = {
    score: $('score'), best: $('best'), lives: $('lives'), combo: $('combo'),
    menu: $('menu'), over: $('over'), start: $('start'), again: $('again'),
    fScore: $('fScore'), fCombo: $('fCombo'), fBest: $('fBest'), newBest: $('newBest'),
    mute: $('mute')
  };
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, dpr = 1, R = 32;
  let ambient = [];

  // ---------- storage (can fail in private mode) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('neuron-dash-best', '0'), 10) || 0;
  let muted = store.get('neuron-dash-muted', '0') === '1';
  el.best.textContent = best;
  el.mute.textContent = muted ? 'Sound off' : 'Sound on';

  // ---------- audio ----------
  let actx = null;
  function ensureAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(freq, dur, type, vol) {
    if (muted || !actx) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  }
  el.mute.addEventListener('click', () => {
    muted = !muted;
    store.set('neuron-dash-muted', muted ? '1' : '0');
    el.mute.textContent = muted ? 'Sound off' : 'Sound on';
  });

  // ---------- sizing ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.max(24, Math.min(40, Math.min(W, H) * 0.05));
    const n = Math.max(28, Math.min(70, Math.round(W * H / 20000)));
    ambient = [];
    for (let i = 0; i < n; i++) {
      ambient.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * 16, vy: (Math.random() - .5) * 16 });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- game state ----------
  let mode = 'menu';           // menu | play | over
  let gt = 0;                  // game time in ms
  let score = 0, combo = 0, maxCombo = 0, hits = 0, level = 0, lives = 3;
  let neurons = [], particles = [], popups = [], links = [];
  let spawnIn = 0, flash = 0, shake = 0, lastHit = null;

  const mult = () => 1 + Math.floor(combo / 5) * 0.5;
  const lifeMs = () => Math.max(1000, 2300 - level * 130);
  const spawnMs = () => Math.max(380, 950 - level * 55);
  const maxActive = () => Math.min(6, 3 + Math.floor(level / 3));

  function setLives() {
    [...el.lives.children].forEach((d, i) => d.classList.toggle('gone', i >= lives));
  }
  function setCombo() {
    el.combo.textContent = combo >= 2 ? 'Combo ' + combo + '  x' + mult().toFixed(1) : '';
  }

  function reset() {
    gt = 0; score = 0; combo = 0; maxCombo = 0; hits = 0; level = 0; lives = 3;
    neurons = []; particles = []; popups = []; links = [];
    spawnIn = 400; flash = 0; shake = 0; lastHit = null;
    el.score.textContent = '0';
    setLives(); setCombo();
  }

  function startGame() {
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    reset();
    mode = 'play';
    el.menu.hidden = true; el.over.hidden = true;
    tone(520, .12, 'triangle', .12);
  }

  function endGame() {
    mode = 'over';
    const isBest = score > best;
    if (isBest) { best = score; store.set('neuron-dash-best', String(best)); }
    el.best.textContent = best;
    el.fScore.textContent = score;
    el.fCombo.textContent = maxCombo;
    el.fBest.textContent = best;
    el.newBest.hidden = !(isBest && score > 0);
    el.over.hidden = false;
    tone(110, .5, 'sawtooth', .12);
    setTimeout(() => el.again.focus({ preventScroll: true }), 50);
  }

  function spawn() {
    const top = 120, margin = R * 2.4;
    for (let tries = 0; tries < 25; tries++) {
      const x = margin + Math.random() * (W - margin * 2);
      const y = top + Math.random() * (H - top - margin);
      if (neurons.every(n => Math.hypot(n.x - x, n.y - y) > R * 4)) {
        const dend = [];
        const count = 5 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) dend.push({ a: (i / count) * Math.PI * 2 + Math.random() * .5, l: Math.random() });
        neurons.push({ x, y, born: gt, life: lifeMs(), seed: Math.random() * 10, dend });
        return;
      }
    }
  }

  function burst(x, y, perfect) {
    const n = reduceMotion ? 6 : (perfect ? 26 : 16);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 90 + Math.random() * 260;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, born: gt, life: 450 + Math.random() * 350, c: perfect && Math.random() < .5 ? '#ffd166' : '#ff7b93' });
    }
  }

  function hit(n) {
    const p = Math.min((gt - n.born) / n.life, 1);
    const perfect = p >= 0.8;
    const pts = Math.round((10 + 40 * p) * mult());
    combo++; hits++;
    if (combo > maxCombo) maxCombo = combo;
    score += pts;
    level = Math.floor(hits / 8);
    el.score.textContent = score;
    setCombo();
    burst(n.x, n.y, perfect);
    popups.push({ x: n.x, y: n.y - R, text: (perfect ? 'Perfect +' : '+') + pts, born: gt, c: perfect ? '#ffd166' : '#eae4ee' });
    if (lastHit) links.push({ x1: lastHit.x, y1: lastHit.y, x2: n.x, y2: n.y, born: gt });
    lastHit = { x: n.x, y: n.y };
    neurons.splice(neurons.indexOf(n), 1);
    tone(330 * Math.pow(2, Math.min(combo, 14) / 12), .13, 'triangle', .14);
  }

  function miss(n) {
    neurons.splice(neurons.indexOf(n), 1);
    combo = 0; lives--; flash = 1; shake = reduceMotion ? 0 : 10; lastHit = null;
    setLives(); setCombo();
    popups.push({ x: n.x, y: n.y, text: 'Lost', born: gt, c: '#ff4d6d' });
    tone(150, .22, 'sawtooth', .1);
    if (lives <= 0) endGame();
  }

  // ---------- input ----------
  function tap(x, y) {
    if (mode !== 'play') return;
    let target = null, bd = Infinity;
    for (const n of neurons) {
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < R * 1.7 && d < bd) { target = n; bd = d; }
    }
    if (target) hit(target);
  }
  cv.addEventListener('pointerdown', (e) => { ensureAudio(); tap(e.clientX, e.clientY); });
  el.start.addEventListener('click', startGame);
  el.again.addEventListener('click', startGame);
  window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'Enter') && mode !== 'play' && document.activeElement !== el.mute) {
      e.preventDefault(); startGame();
    }
  });

  // ---------- update ----------
  function update(dt) {
    for (const a of ambient) {
      a.x += a.vx * dt / 1000; a.y += a.vy * dt / 1000;
      if (a.x < 0 || a.x > W) a.vx *= -1;
      if (a.y < 0 || a.y > H) a.vy *= -1;
    }
    flash = Math.max(0, flash - dt / 450);
    shake = Math.max(0, shake - dt / 40);
    if (mode !== 'play') return;

    gt += dt;
    spawnIn -= dt;
    if (spawnIn <= 0 && neurons.length < maxActive()) { spawn(); spawnIn = spawnMs(); }
    for (const n of neurons.slice()) {
      if (gt - n.born >= n.life) { miss(n); if (mode !== 'play') break; }
    }
    particles = particles.filter(p => gt - p.born < p.life);
    for (const p of particles) {
      p.x += p.vx * dt / 1000; p.y += p.vy * dt / 1000;
      p.vx *= 0.97; p.vy *= 0.97;
    }
    popups = popups.filter(p => gt - p.born < 800);
    links = links.filter(l => gt - l.born < 700);
  }

  // ---------- draw ----------
  const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

  function drawAmbient() {
    ctx.lineWidth = 1;
    for (let i = 0; i < ambient.length; i++) {
      const a = ambient[i];
      for (let j = i + 1; j < ambient.length; j++) {
        const b = ambient[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 130) {
          ctx.strokeStyle = 'rgba(255,123,147,' + (0.16 * (1 - d / 130)) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    ctx.fillStyle = 'rgba(255,123,147,0.35)';
    for (const a of ambient) { ctx.beginPath(); ctx.arc(a.x, a.y, 1.8, 0, Math.PI * 2); ctx.fill(); }
  }

  function drawNeuron(n) {
    const age = gt - n.born;
    const p = Math.min(age / n.life, 1);
    const appear = Math.min(age / 180, 1);
    const r = R * (1 + Math.sin(gt / 170 + n.seed) * 0.05) * easeOutBack(appear);

    const g = ctx.createRadialGradient(n.x, n.y, r * 0.2, n.x, n.y, r * 2.6);
    g.addColorStop(0, 'rgba(255,123,147,0.5)');
    g.addColorStop(1, 'rgba(255,123,147,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 2.6, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = 'rgba(255,123,147,0.75)';
    ctx.fillStyle = '#ff7b93';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < n.dend.length; i++) {
      const d = n.dend[i];
      const a = d.a + Math.sin(gt / 650 + i + n.seed) * 0.14;
      const len = r * (1.5 + d.l * 0.8);
      const x1 = n.x + Math.cos(a) * r * 0.9, y1 = n.y + Math.sin(a) * r * 0.9;
      const x2 = n.x + Math.cos(a) * len, y2 = n.y + Math.sin(a) * len;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x2, y2, 2.6, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#ff7b93';
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a2330';
    ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.42, 0, Math.PI * 2); ctx.fill();

    const ringR = r + (1 - p) * R * 2.4;
    ctx.strokeStyle = 'hsl(' + (42 - 57 * p) + ',100%,60%)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(n.x, n.y, ringR, 0, Math.PI * 2); ctx.stroke();
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#17141b'); bg.addColorStop(1, '#221c29');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    drawAmbient();

    for (const l of links) {
      const k = (gt - l.born) / 700;
      ctx.strokeStyle = 'rgba(255,209,102,' + (0.8 * (1 - k)) + ')';
      ctx.lineWidth = 3 * (1 - k) + 1;
      ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
      const sx = l.x1 + (l.x2 - l.x1) * Math.min(k * 2, 1), sy = l.y1 + (l.y2 - l.y1) * Math.min(k * 2, 1);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx, sy, 4 * (1 - k) + 1, 0, Math.PI * 2); ctx.fill();
    }

    for (const n of neurons) drawNeuron(n);

    for (const p of particles) {
      const k = (gt - p.born) / p.life;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.2 * (1 - k) + 0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    ctx.font = '600 15px "JetBrains Mono", ui-monospace, monospace';
    for (const p of popups) {
      const k = (gt - p.born) / 800;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = p.c;
      ctx.fillText(p.text, p.x, p.y - k * 36);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,77,109,' + (flash * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 50);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
