<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" role="img" aria-label="Say hi" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c24"/><stop offset="1" stop-color="#17144a"/></linearGradient><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ce1e6"/><stop offset="0.5" stop-color="#ffb703"/><stop offset="1" stop-color="#ff5c7a"/></linearGradient></defs><rect x="1" y="1" width="898" height="174" rx="16" fill="url(#bg)" stroke="#2a2f63" stroke-width="2"/><text x="36" y="53" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">I&#x27;m happy to talk about AI in healthcare, learning tools, or which paper kept you up</text><text x="36" y="81" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">last night.</text><text x="36" y="123" font-size="17" fill="#9aa0cf" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Fun fact: I debug by talking to my code out loud, and it helps more than you&#x27;d think.</text></svg>