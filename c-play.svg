<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 232" width="900" height="232" role="img" aria-label="About the games on this page" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090c24"/><stop offset="1" stop-color="#17144a"/></linearGradient><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ce1e6"/><stop offset="0.5" stop-color="#ffb703"/><stop offset="1" stop-color="#ff5c7a"/></linearGradient></defs><rect x="1" y="1" width="898" height="230" rx="16" fill="url(#bg)" stroke="#2a2f63" stroke-width="2"/><text x="36" y="53" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Neuron Dash is a small game I made for this page. Neurons light up, rings close in,</text><text x="36" y="81" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">and you tap each one at the right moment. The longer you wait the more points you get,</text><text x="36" y="109" font-size="17" fill="#eef0ff" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">but wait too long and you lose a signal. It works on phones too.</text><text x="36" y="151" font-size="17" fill="#9aa0cf" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">The snake below eats my contribution squares. The more I commit, the more it has to</text><text x="36" y="179" font-size="17" fill="#9aa0cf" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">eat.</text></svg>